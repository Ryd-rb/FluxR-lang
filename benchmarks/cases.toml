[heldout.translated_pulse]
kind = "timeline"
task = "Repeat every 32 milliseconds. For object IDs 42 through 55 inclusive on field 7, linearly interpolate keys 0:0, 16:48, 32:0, with each next object shifted down 7 from the previous one. Also set object 91, field 4, to a constant 9. Missing addresses return no value."
edit = "Shift each successive translated track down 9 instead of 7."
fluxr = '''
v2 32
+ 42 14 7 1 -7 0:0 16:48 32:0
91 4 0 0:9
'''
rust = '''
pub fn calc(object: u16, field: u16, time: u32) -> Option<i32> {
    match (object, field) {
        (42..=55, 7) => {
            let t = (time % 32) as i32;
            Some(3 * t.min(32 - t) - 7 * i32::from(object - 42))
        }
        (91, 4) => Some(9),
        _ => None,
    }
}
'''
fluxr_span = ["-7", "-9"]
rust_span = ["- 7 *", "- 9 *"]

[heldout.minimum_bits]
kind = "structured"
task = "Export calc. Given a binary32 list x, return the first strictly least element as its original bits. If the first value is NaN, it stays selected. Later NaNs and ties never replace the selected element. Empty input traps on indexing."
edit = "Return the first value regardless of the remaining values. Preserve the empty input trap."
fluxr = '''
v2
(pub calc (x:[f32]) f32 () (ret (at x (minidx x))))
'''
rust = '''
pub fn calc(x: &[f32]) -> Option<f32> {
    let mut i = 0;
    for j in 1..x.len() {
        if x[j] < x[i] {
            i = j;
        }
    }
    x.get(i).copied()
}
'''
fluxr_span = ["(minidx x)", "0u"]
rust_span = ["get(i)", "first()"]

[heldout.first_alert]
kind = "structured"
task = "Export calc. Given an i64 list x, a u64 limit n and an i64 threshold t, find the first index below n whose value is greater than t. Return n when no index qualifies. Reading beyond x before finding a match traps."
edit = "Include values equal to the threshold."
fluxr = '''
v2
(pub calc (x:[i64] n:u64 t:i64) u64 (i:u64 row:i64) (find i n row x (< t row)))
'''
rust = '''
pub fn calc(x: &[i64], n: u64, t: i64) -> Option<u64> {
    for i in 0..n {
        if *x.get(usize::try_from(i).ok()?)? > t {
            return Some(i);
        }
    }
    Some(n)
}
'''
fluxr_span = ["(<", "(<="]
rust_span = ["> t", ">= t"]

[heldout.ledger]
kind = "structured"
task = "Export calc. Take a Ledger record with balance and watermark i64 fields and a signed delta. Add delta to balance with checked arithmetic. Return the record with the new balance and the greater of the old watermark and new balance. Arithmetic failure fails the call."
edit = "Subtract the delta using checked arithmetic. Leave the watermark rule in place."
fluxr = '''
v2
(rec Ledger balance:i64 watermark:i64)
(pub calc (r:Ledger d:i64) Ledger ()
  (= r.balance (+ r.balance d))
  (when (< r.watermark r.balance) (= r.watermark r.balance))
  (ret r))
'''
rust = '''
pub struct Ledger {
    pub balance: i64,
    pub watermark: i64,
}
pub fn calc(r: Ledger, d: i64) -> Option<Ledger> {
    let balance = r.balance.checked_add(d)?;
    Some(Ledger { balance, watermark: r.watermark.max(balance) })
}
'''
fluxr_span = ["+", "-"]
rust_span = ["checked_add", "checked_sub"]
